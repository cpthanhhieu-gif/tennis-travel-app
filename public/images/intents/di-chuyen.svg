    <path d="M731 324l25 15-28 12" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Friendly 3D city bus -->
  <g transform="rotate(-7 526 365)">
    <path d="M402 322c0-25 20-45 45-45h170c31 0 57 22 62 53l16 101c4 24-14 45-38 45H427c-24 0-43-19-43-43l18-111Z" fill="#0FB982"/>
