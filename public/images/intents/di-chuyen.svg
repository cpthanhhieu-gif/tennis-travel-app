<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="blue" x1="280" y1="450" x2="790" y2="680" gradientUnits="userSpaceOnUse">
      <stop stop-color="#54B9FF"/><stop offset="1" stop-color="#1764E8"/>
    </linearGradient>
    <linearGradient id="silver" x1="300" y1="520" x2="770" y2="745" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8EDFF"/><stop offset="1" stop-color="#ADB9F5"/>
    </linearGradient>
    <linearGradient id="mint" x1="360" y1="250" x2="690" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8AE6B6"/><stop offset="1" stop-color="#18C98B"/>
    </linearGradient>
    <linearGradient id="window" x1="425" y1="315" x2="650" y2="398" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DDF7FF"/><stop offset="1" stop-color="#75C8F8"/>
    </linearGradient>
    <linearGradient id="coin" x1="190" y1="260" x2="320" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#C8D8F4"/>
    </linearGradient>
    <filter id="shadow" x="150" y="180" width="730" height="690" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="17"/>
    </filter>
  </defs>

  <!-- Soft grounding shadow and the familiar stacked blue cards -->
  <ellipse cx="510" cy="790" rx="315" ry="55" fill="#7489DB" opacity=".2" filter="url(#shadow)"/>
  <g transform="rotate(-8 512 650)">
