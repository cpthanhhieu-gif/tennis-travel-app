    <path d="M401 411h286" stroke="#8AE6B6" stroke-width="8" opacity=".8"/>
    <rect x="422" y="420" width="42" height="20" rx="10" fill="#FFF0A6"/>
    <rect x="627" y="420" width="37" height="20" rx="10" fill="#FFF0A6"/>
    <path d="M449 465v14m174-14v14" stroke="#1764E8" stroke-width="13" stroke-linecap="round"/>
    <circle cx="463" cy="474" r="31" fill="#F5F7FF"/>
    <circle cx="463" cy="474" r="19" fill="#7184C9"/>
    <circle cx="622" cy="474" r="31" fill="#F5F7FF"/>
    <circle cx="622" cy="474" r="19" fill="#7184C9"/>
