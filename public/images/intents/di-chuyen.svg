    <circle cx="244" cy="328" r="62" fill="url(#coin)"/>
    <circle cx="244" cy="328" r="48" stroke="#FFFFFF" stroke-width="5" opacity=".9"/>
    <path d="M229 347v-27c0-9 7-16 16-16h4c9 0 16 7 16 16v27m-36-17h36m-38 18h40" stroke="#91A1BF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
