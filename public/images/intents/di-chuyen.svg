    <rect x="202" y="512" width="620" height="172" rx="50" fill="#F5F7FF"/>
    <rect x="202" y="475" width="620" height="176" rx="50" fill="url(#blue)"/>
    <path d="M252 491h236v153H252q-35 0-35-36V526q0-35 35-35Z" fill="#66B4FF" opacity=".52"/>
    <path d="M488 491h285q35 0 35 35v82H488V491Z" fill="#1469D6" opacity=".4"/>
    <path d="M488 567h320v42q0 35-35 35H488v-77Z" fill="#8DCBFF" opacity=".36"/>
  </g>

  <!-- Floating mint route card -->
  <g transform="rotate(-9 510 385)">
